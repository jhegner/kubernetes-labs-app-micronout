apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-micronout-externalsecret-lab
  namespace: labs
spec:
  secretStoreRef:
    name: secretstore-awsiam-credencial
    kind: SecretStore
  target:
    name: app-micronout-secret
    creationPolicy: Owner
  data:
  - secretKey: MOCKAPI_PROJECT_SECRET
    remoteRef:
      key: lab/kubernetes
      property: MOCKAPI_PROJECT_SECRET
