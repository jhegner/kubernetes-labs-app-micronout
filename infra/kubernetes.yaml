apiVersion: v1
kind: ConfigMap
metadata:
  name: app-micronout-config
  namespace: labs
  labels:
    projeto: projeto-1
    app: app-micronout
    team: devops
    env: lab
data:
  mockapi-path-prefix: mockapi.io
  MOCKAPI_VERSION: api/v1

---

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-micronout-externalsecret-lab
  namespace: labs
spec:
  secretStoreRef:
    name: secretstore-awsiam-credencial
    kind: SecretStore
  target:
    name: app-micronout-secret
    creationPolicy: Owner
  data:
  - secretKey: MOCKAPI_PROJECT_SECRET
    remoteRef:
      key: lab/kubernetes
      property: MOCKAPI_PROJECT_SECRET

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-micronout
  namespace: labs
  labels:
    projeto: projeto-1
    app: app-micronout
    stack: micronaut
    team: devops
    env: lab
spec:
  replicas: 3
  selector:
    matchLabels:
      app: app-micronout
  template:
    metadata:
      labels:
        projeto: projeto-1
        app: app-micronout
        stack: micronaut
        team: devops
        env: lab
    spec:
      containers:
        - name: app-micronout
          image: ${IMAGE_NAME}:${IMAGE_TAG}
          imagePullPolicy: Always
          resources:
            limits:
              memory: "800Mi"
              cpu: "500m"
            requests:
              memory: "400Mi"
              cpu: "250m"
          ports:
            - containerPort: 8080
          env:
            - name: MOCKAPI_PATH_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: app-micronout-config
                  key: mockapi-path-prefix   
            - name: MOCKAPI_VERSION
              valueFrom:
                configMapKeyRef:
                  name: app-micronout-config
                  key: MOCKAPI_VERSION                       
            - name: MOCKAPI_PROJECT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-micronout-secret
                  key: MOCKAPI_PROJECT_SECRET
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

---

apiVersion: v1
kind: Service
metadata:
  name: app-micronout-service-lb
  namespace: labs
  labels:
    app: app-micronout
    component: api
    projeto: projeto-1
    team: devops
    env: lab    
  annotations:
    service.beta.kubernetes.io/vultr-loadbalancer-protocol: "http"
    service.beta.kubernetes.io/vultr-loadbalancer-label: "labs-service-lb"
    service.beta.kubernetes.io/vultr-loadbalancer-algorithm: "least_connections"
    service.beta.kubernetes.io/vultr-loadbalancer-healthcheck-path: "/health"
    service.beta.kubernetes.io/vultr-loadbalancer-healthcheck-check-interval: "5"
    service.beta.kubernetes.io/vultr-loadbalancer-healthcheck-response-timeout: "3"
    service.beta.kubernetes.io/vultr-loadbalancer-healthcheck-unhealthy-threshold: "3"
    service.beta.kubernetes.io/vultr-loadbalancer-healthcheck-healthy-threshold: "2"   
spec:
  type: LoadBalancer
  selector:
    app:  app-micronout
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
