apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-micronout
  namespace: labs
  labels:
    projeto: projeto-1
    app: app-micronout
    stack: micronaut
    team: devops
    environment: labs
spec:
  replicas: 3
  selector:
    matchLabels:
      app: app-micronout
  template:
    metadata:
      labels:
        app: app-micronout
    spec:
      containers:
        - name: app-micronout
          image: ${IMAGE_NAME}:${IMAGE_TAG}
          resources:
            limits:
              memory: "800Mi"
              cpu: "500m"
            requests:
              memory: "400Mi"
              cpu: "250m"
          ports:
            - containerPort: 8080
          env:
            - name: MOCKAPI_PATH_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: app-micronout-config-lab
                  key: mockapi-path-prefix                  
            - name: MOCKAPI_PROJECT_SECRET
              valueFrom:
                secretKeyRef:
                  name: secret-workload-lab
                  key: lab-secret
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            failureThreshold: 3
            periodSeconds: 5
            successThreshold: 1

---

apiVersion: v1
kind: Service
metadata:
  name: app-micronout-service-lb
  namespace: labs
  annotations:
    service.beta.kubernetes.io/vultr-loadbalancer-protocol: "http"
    service.beta.kubernetes.io/vultr-loadbalancer-label: "labs-service-lb"
    service.beta.kubernetes.io/vultr-loadbalancer-algorithm: "least_connections"
    service.beta.kubernetes.io/vultr-loadbalancer-healthcheck-path: "/health"
    service.beta.kubernetes.io/vultr-loadbalancer-healthcheck-check-interval: "10"
    service.beta.kubernetes.io/vultr-loadbalancer-healthcheck-response-timeout: "5"
    service.beta.kubernetes.io/vultr-loadbalancer-healthcheck-unhealthy-threshold: "5"
    service.beta.kubernetes.io/vultr-loadbalancer-healthcheck-healthy-threshold: "5"    
spec:
  type: LoadBalancer
  selector:
    app:  app-micronout-lab
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: app-micronout-config-lab
  namespace: labs
data:
  mockapi-path-prefix: mockapi.io

---

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-micronout-externalsecret-lab
spec:
  refreshInterval: 0
  secretStoreRef:
    name: secret-store-eso-lab
    kind: SecretStore
  target:
    name: secret-workload-lab
    creationPolicy: Owner
  data:
  - secretKey: lab-secret
    remoteRef:
      key: lab/kubernetes
      property: MOCKAPI_PROJECT_SECRET
      decodingStrategy: Base64
